services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: desenrola_next
    ports:
      - "127.0.0.1:3001:3000"   # <-- só local
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    restart: always
